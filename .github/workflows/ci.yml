# Intégration continue : à chaque push et pull request, on vérifie le cœur, l'éditeur, le hub Rust,
# la fidélité de l'import/export, la collaboration de bout en bout et l'image Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Cœur et éditeur (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @swiftma/editor
      - name: Banc de fidélité (exemples)
        run: |
          npm ci --prefix tests/fidelity/harness
          npx playwright install --with-deps chromium
          npm run fidelity -- examples --strict --jobs 2 --out tests/fidelity/results/ci
          npm run fidelity -- examples --strict --jobs 2 --canvas --out tests/fidelity/results/ci-canvas
          npm run fidelity -- examples --strict --jobs 2 --responsive --styles --out tests/fidelity/results/ci-responsive
      - name: Écarts de fidélité
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fidelite
          path: tests/fidelity/results

  hub:
    name: Hub (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hub
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/hub
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  e2e:
    name: Collaboration de bout en bout
    runs-on: ubuntu-latest
    needs: [web, hub]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/hub
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cargo build --manifest-path apps/hub/Cargo.toml
      - name: Lancer hub, service MCP/IA et éditeur
        run: |
          SWIFTMA_MCP_URL=http://localhost:4001 apps/hub/target/debug/swiftma-hub > hub.log 2>&1 &
          npm start -w @swiftma/server > mcp.log 2>&1 &
          npm run dev -w @swiftma/editor > editor.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf localhost:4000/api/health && curl -sf localhost:4001/api/ai/health && curl -sf localhost:5173 > /dev/null && break
            sleep 1
          done
      - run: node tests/e2e/collaboration.mjs
      - name: Journaux et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            *.log
            tests/e2e/captures

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [web, hub]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: swiftma:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Démarrer le conteneur et vérifier
        run: |
          docker run -d --name swiftma -p 4000:4000 swiftma:ci
          for i in $(seq 1 30); do curl -sf localhost:4000/api/health && break; sleep 1; done
          curl -sf localhost:4000/ | grep -q "<title>Swiftma"
          # Sans compte : tout est fermé
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4000/api/projects)" = 401
          # Premier compte (administrateur), puis vérifications avec sa session
          curl -sf -c session.txt -H 'Content-Type: application/json' \
            -d '{"email":"ci@exemple.cm","name":"CI","password":"motdepasse-ci"}' localhost:4000/api/auth/register
          curl -sf -b session.txt localhost:4000/api/projects
          # Le service MCP/IA (relayé en /api/ai/*) démarre quelques secondes après le hub
          for i in $(seq 1 60); do curl -sf -b session.txt localhost:4000/api/ai/health && break; sleep 1; done
          curl -sf -b session.txt localhost:4000/api/ai/health || (docker logs swiftma; exit 1)
          # Commande d'administration dans le conteneur : lien de réinitialisation du mot de passe
          docker exec swiftma swiftma-hub reset-password ci@exemple.cm | grep -q "/reset#"
      - name: Vérifier la configuration HTTPS (Caddy)
        run: |
          docker compose --profile https config -q
          docker run --rm -e SWIFTMA_DOMAIN=design.example.org -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile
