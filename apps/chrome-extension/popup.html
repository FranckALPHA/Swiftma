<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Swiftma — Capture HTML</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>HTML vers Swiftma</h1>
      <p>Convertissez des pages web ou composants en calques éditables dans Swiftma.</p>
      <div class="actions">
        <button id="capture-visible" type="button" class="btn primary">Capturer la fenêtre visible</button>
        <button id="capture-full" type="button" class="btn secondary">Capturer la page entière</button>
        <button id="capture-site" type="button" class="btn accent">Cloner tout le site (multi-pages)</button>
        <button id="inspect-element" type="button" class="btn outline">Sélectionner un composant</button>
        <button id="stop-capture" type="button" class="btn danger" style="display: none;">Arrêter et télécharger</button>
      </div>
      <fieldset class="responsive">
        <legend>Responsive</legend>
        <p class="hint">Coche une ou plusieurs tailles : chaque largeur devient une frame du même fichier Swiftma.</p>
        <label><input type="checkbox" class="bp" value="390"> Mobile <span>390 px</span></label>
        <label><input type="checkbox" class="bp" value="768"> Tablette <span>768 px</span></label>
        <label><input type="checkbox" class="bp" value="1280"> Laptop <span>1280 px</span></label>
        <label><input type="checkbox" class="bp" value="1536"> Bureau <span>1536 px</span></label>
        <label class="custom"><input type="checkbox" id="bp-custom-on"> Personnalisée
          <input id="bp-custom" type="number" min="240" max="3840" step="1" value="1024" inputmode="numeric"> px
        </label>
      </fieldset>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
