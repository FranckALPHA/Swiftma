<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Effets pour Swiftma</title>
<link rel="stylesheet" href="../plugin.css" />
<style>
  .fx { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .fx button { border: 0; border-radius: 12px; padding: 0; cursor: pointer; background: none; color: var(--text); text-align: left; }
  .fx .demo { height: 74px; border-radius: 12px; position: relative; overflow: hidden; display: grid; place-items: center;
    background: radial-gradient(circle at 25% 30%, #0a84ff, transparent 55%), radial-gradient(circle at 80% 70%, #bf5af2, transparent 55%), #1c1c1e; }
  .fx .demo i { width: 62%; height: 52%; border-radius: 12px; display: block; }
  .fx button:hover .demo { outline: 2px solid var(--accent); }
  .fx .name { display: block; margin-top: 5px; font-weight: 600; }
  .fx .what { display: block; color: var(--muted); font-size: 10.5px; margin-top: 1px; }
  .check { flex-direction: row; align-items: center; gap: 6px; color: var(--text-2); }
  .check input { height: auto; }
</style>
</head>
<body>
  <div class="status" id="target" style="margin-top: 0">Sélectionne des éléments (frames, rectangles…) puis choisis un effet.</div>
  <div class="row">
    <label>Couleur (néon, verre teinté)<input type="color" id="accent" value="#0a84ff" /></label>
    <label class="check"><input type="checkbox" id="round" checked /> Coins arrondis (20 px)</label>
  </div>
  <div class="fx" id="fx"></div>
  <div class="row"><button class="btn" id="clear">Retirer les effets</button></div>
  <div class="status" id="status">Astuce : le verre se voit sur un fond coloré ou une photo (plugin « Textures et fonds » → Aurore). Tout reste
    modifiable dans les propriétés (Apparence, Effets) et s'annule avec Ctrl+Z.</div>
<script src="../swiftma-plugin.js"></script>
<script>
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var selection = [];
  function alpha(hex, a) { return hex.toUpperCase() + Math.round(a * 255).toString(16).padStart(2, "0").toUpperCase(); }
  function shadow(type, x, y, blur, spread, color) { return { type: type, x: x, y: y, blur: blur, spread: spread, color: color }; }

  // Chaque effet : ce qu'il applique (propriétés Swiftma), et son aperçu CSS
  var EFFECTS = [
    { id: "verre", name: "Verre dépoli", what: "Glassmorphism clair", css: "background:rgba(255,255,255,.18);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 24px rgba(0,0,0,.25)",
      props: function () { return { fill: "#FFFFFF2E", gradient: null, backgroundBlur: 24, stroke: { color: "#FFFFFF59", width: 1 }, shadows: [shadow("drop", 0, 8, 32, 0, "#0000002E")] }; } },
    { id: "verre-sombre", name: "Verre sombre", what: "Glassmorphism sombre", css: "background:rgba(28,28,30,.45);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.35)",
      props: function () { return { fill: "#1C1C1E73", gradient: null, backgroundBlur: 24, stroke: { color: "#FFFFFF1F", width: 1 }, shadows: [shadow("drop", 0, 8, 32, 0, "#00000059")] }; } },
    { id: "liquid", name: "Liquid glass", what: "Verre liquide, reflets", css: "background:linear-gradient(135deg,rgba(255,255,255,.45),rgba(255,255,255,.06) 45%,rgba(255,255,255,.16));backdrop-filter:blur(8px) saturate(160%);border:1.5px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 2px rgba(0,0,0,.15),0 12px 30px rgba(0,0,0,.3)",
      props: function () {
        return {
          fill: "#FFFFFF1A", backgroundBlur: 16, stroke: { color: "#FFFFFF8C", width: 1.5 },
          gradient: { type: "linear", start: [0, 0], end: [1, 1], stops: [{ offset: 0, color: "#FFFFFF73" }, { offset: 0.45, color: "#FFFFFF0F" }, { offset: 1, color: "#FFFFFF29" }] },
          shadows: [shadow("inner", 0, 1, 0, 0, "#FFFFFFB3"), shadow("inner", 0, -1, 2, 0, "#00000026"), shadow("drop", 0, 12, 40, 0, "#00000040")],
        };
      } },
    { id: "verre-teinte", name: "Verre teinté", what: "Verre à la couleur choisie", css: "background:rgba(10,132,255,.28);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3)",
      props: function (c) { return { fill: alpha(c, 0.28), gradient: null, backgroundBlur: 20, stroke: { color: "#FFFFFF4D", width: 1 }, shadows: [shadow("drop", 0, 8, 28, 0, alpha(c, 0.25))] }; } },
    { id: "neon", name: "Néon", what: "Halo lumineux", css: "background:#0b0b14;border:1.5px solid #0a84ff;box-shadow:0 0 10px #0a84ff,0 0 26px rgba(10,132,255,.6)",
      props: function (c) { return { stroke: { color: c, width: 1.5 }, shadows: [shadow("drop", 0, 0, 12, 0, c), shadow("drop", 0, 0, 32, 0, alpha(c, 0.6))] }; } },
    { id: "douce", name: "Ombre douce", what: "Élévation discrète", css: "background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12),0 12px 28px rgba(0,0,0,.2)",
      props: function () { return { shadows: [shadow("drop", 0, 4, 12, 0, "#0000001A"), shadow("drop", 0, 16, 40, 0, "#00000026")] }; } },
    { id: "neumorphisme", name: "Neumorphisme", what: "Relief clair", css: "background:#e9edf2;box-shadow:-5px -5px 12px rgba(255,255,255,.9),5px 5px 12px rgba(163,177,198,.7)",
      props: function () { return { fill: "#E9EDF2", gradient: null, stroke: null, shadows: [shadow("drop", -6, -6, 16, 0, "#FFFFFFE6"), shadow("drop", 6, 6, 16, 0, "#A3B1C6B3")] }; } },
    { id: "flou", name: "Flou", what: "Flou du calque lui-même", css: "background:linear-gradient(135deg,#ff9f0a,#ff375f);filter:blur(4px)",
      props: function () { return { layerBlur: 12 }; } },
  ];

  async function refresh() {
    try {
      selection = await swiftma.call("getSelection");
      $("target").textContent = selection.length
        ? selection.length + " élément" + (selection.length > 1 ? "s" : "") + " sélectionné" + (selection.length > 1 ? "s" : "") + " : choisis un effet."
        : "Sélectionne des éléments (frames, rectangles…) puis choisis un effet.";
    } catch (e) { /* lecture impossible */ }
  }

  async function apply(updates, label) {
    if (!selection.length) { $("status").textContent = "Sélectionne d'abord un ou plusieurs éléments."; return; }
    try {
      await swiftma.call("runTool", { name: "update_nodes", input: { updates: updates } });
      $("status").textContent = label + " appliqué à " + updates.length + " élément" + (updates.length > 1 ? "s" : "") + ". Ctrl+Z pour annuler.";
    } catch (e) { $("status").textContent = "Impossible : " + e.message; }
  }

  EFFECTS.forEach(function (fx) {
    var b = document.createElement("button");
    b.title = fx.what;
    b.innerHTML = '<span class="demo"><i></i></span><span class="name"></span><span class="what"></span>';
    b.querySelector("i").style.cssText = fx.css;
    b.querySelector(".name").textContent = fx.name;
    b.querySelector(".what").textContent = fx.what;
    b.addEventListener("click", function () {
      var c = $("accent").value;
      apply(selection.map(function (n) {
        var p = Object.assign({ id: n.id }, fx.props(c));
        // Un texte garde sa couleur : seuls ombres, contour et flous s'y appliquent
        if (n.type === "text") { delete p.fill; delete p.gradient; delete p.backgroundBlur; }
        else if ($("round").checked && n.type !== "ellipse" && !(n.radius > 0)) p.radius = 20;
        return p;
      }), fx.name);
    });
    $("fx").appendChild(b);
  });
  $("clear").addEventListener("click", function () {
    apply(selection.map(function (n) { return { id: n.id, shadows: [], backgroundBlur: null, layerBlur: null }; }), "Retrait des effets");
  });
  swiftma.on("selection", refresh);
  refresh();
</script>
</body>
</html>
