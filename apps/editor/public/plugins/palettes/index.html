<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Palettes pour Swiftma</title>
<link rel="stylesheet" href="../plugin.css" />
<style>
  .pal { margin-top: 6px; }
  .pal .head { display: flex; justify-content: space-between; align-items: center; color: var(--text-2); margin-bottom: 4px; }
  .pal .head button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 0; }
  .sw { display: flex; border-radius: 10px; overflow: hidden; height: 34px; }
  .sw button { flex: 1; border: 0; cursor: pointer; padding: 0; font-size: 9px; color: transparent; }
  .sw button:hover { color: inherit; outline: 2px solid #fff; outline-offset: -2px; }
</style>
</head>
<body>
  <div class="row" style="margin-top: 0">
    <input type="color" id="base" value="#0a84ff" class="fit" title="Couleur de base" />
    <input id="hex" value="#0A84FF" maxlength="7" spellcheck="false" />
    <input id="name" value="Primaire" title="Nom des styles créés" />
  </div>
  <div id="palettes"></div>
  <div class="status" id="status">Clic sur une couleur : elle colore la sélection. « Créer les styles » : des couleurs partagées, réutilisables partout.</div>
<script src="../swiftma-plugin.js"></script>
<script>
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  function hexToHsl(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, h = 0, s = 0;
    if (max !== min) {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }
  function hslToHex(h, s, l) {
    h = ((h % 360) + 360) % 360;
    var k = function (n) { return (n + h / 30) % 12; };
    var a = s * Math.min(l, 1 - l);
    var f = function (n) { return Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))))).toString(16).padStart(2, "0"); };
    return ("#" + f(0) + f(8) + f(4)).toUpperCase();
  }

  function palettes(hex) {
    var hsl = hexToHsl(hex), h = hsl[0], s = hsl[1];
    var steps = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900];
    var light = [0.96, 0.91, 0.82, 0.72, 0.62, 0.52, 0.44, 0.36, 0.28, 0.2];
    return [
      { name: "Nuances", labels: steps.map(String), colors: light.map(function (l, i) { return hslToHex(h, Math.min(1, s * (i < 2 ? 0.9 : 1)), l); }) },
      { name: "Complémentaire", labels: ["Base", "", "Opposée", ""], colors: [hex.toUpperCase(), hslToHex(h, s, 0.75), hslToHex(h + 180, s, hsl[2]), hslToHex(h + 180, s, 0.75)] },
      { name: "Analogues", labels: ["−30°", "Base", "+30°", "+60°"], colors: [hslToHex(h - 30, s, hsl[2]), hex.toUpperCase(), hslToHex(h + 30, s, hsl[2]), hslToHex(h + 60, s, hsl[2])] },
      { name: "Triade", labels: ["Base", "+120°", "+240°"], colors: [hex.toUpperCase(), hslToHex(h + 120, s, hsl[2]), hslToHex(h + 240, s, hsl[2])] },
      { name: "Neutres teintés", labels: steps.map(String), colors: light.map(function (l) { return hslToHex(h, Math.min(0.12, s), l); }) },
    ];
  }

  async function applyFill(color) {
    try {
      var sel = await swiftma.call("getSelection");
      if (!sel.length) { $("status").textContent = "Sélectionne d'abord un ou plusieurs éléments."; return; }
      await swiftma.call("runTool", { name: "update_nodes", input: { updates: sel.map(function (n) { return n.type === "text" ? { id: n.id, text: Object.assign({}, n.text, { color: color }) } : { id: n.id, fill: color }; }) } });
      $("status").textContent = color + " appliquée à " + sel.length + " élément" + (sel.length > 1 ? "s" : "") + ".";
    } catch (e) { $("status").textContent = "Impossible : " + e.message; }
  }

  async function createStyles(p) {
    var base = $("name").value.trim() || "Couleur";
    try {
      for (var i = 0; i < p.colors.length; i++) {
        var label = p.labels[i] || String(i + 1);
        await swiftma.call("runTool", { name: "set_style", input: { kind: "colors", style: { name: base + (p.name === "Nuances" ? " " : " " + p.name + " ") + label, value: p.colors[i] } } });
      }
      $("status").textContent = p.colors.length + " styles « " + base + " » créés : liste des styles quand rien n'est sélectionné, et variables CSS à l'export React.";
    } catch (e) { $("status").textContent = "Impossible de créer les styles : " + e.message; }
  }

  function render() {
    var hex = $("base").value;
    $("palettes").innerHTML = "";
    palettes(hex).forEach(function (p) {
      var wrap = document.createElement("div");
      wrap.className = "pal";
      wrap.innerHTML = '<div class="head"><span></span><button>Créer les styles</button></div><div class="sw"></div>';
      wrap.querySelector("span").textContent = p.name;
      wrap.querySelector("button").addEventListener("click", function () { createStyles(p); });
      p.colors.forEach(function (c, i) {
        var b = document.createElement("button");
        b.style.background = c;
        b.style.color = hexToHsl(c)[2] > 0.6 ? "#000" : "#fff";
        b.textContent = p.labels[i] || "";
        b.title = c + " — clic pour colorer la sélection";
        b.addEventListener("click", function () { applyFill(c); });
        wrap.querySelector(".sw").appendChild(b);
      });
      $("palettes").appendChild(wrap);
    });
  }

  $("base").addEventListener("input", function () { $("hex").value = $("base").value.toUpperCase(); render(); });
  $("hex").addEventListener("input", function () {
    var v = $("hex").value.trim();
    if (/^#?[0-9a-f]{6}$/i.test(v)) { $("base").value = (v[0] === "#" ? v : "#" + v).toLowerCase(); render(); }
  });
  render();
</script>
</body>
</html>
