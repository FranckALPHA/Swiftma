<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Textures et fonds pour Swiftma</title>
<link rel="stylesheet" href="../plugin.css" />
<style>
  .tile { background: repeating-conic-gradient(#2c2c2e 0 25%, #3a3a3c 0 50%) 0 0 / 12px 12px; }
  .tile span { position: absolute; left: 6px; bottom: 5px; font-size: 10px; text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
  <div class="row" style="margin-top: 0">
    <label>Couleur 1<input type="color" id="c1" value="#0a84ff" /></label>
    <label>Couleur 2<input type="color" id="c2" value="#bf5af2" /></label>
    <label>Couleur 3<input type="color" id="c3" value="#ff9f0a" /></label>
  </div>
  <div class="row">
    <label>Intensité<input type="range" id="amount" min="5" max="100" value="45" /></label>
    <label>Taille
      <select id="size"><option value="390x844">390 × 844 (mobile)</option><option value="1440x900" selected>1440 × 900</option><option value="800x800">800 × 800</option><option value="400x400">400 × 400</option></select>
    </label>
  </div>
  <h3>Fonds</h3>
  <div class="grid" id="backgrounds"></div>
  <h3>Textures à superposer</h3>
  <div class="grid" id="overlays"></div>
  <div class="status" id="status">Glassmorphism : un fond « Aurore » ou « Maillage », une frame semi-transparente par-dessus avec un flou
    d'arrière-plan (Apparence → effets), puis du « Grain » à 10–20 % d'opacité.</div>
<script src="../swiftma-plugin.js"></script>
<script>
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function rgb(hex) { return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; }
  // Générateur pseudo-aléatoire à graine : l'aperçu et l'image insérée sont identiques
  function rng(seed) { return function () { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

  var TEXTURES = [
    { id: "aurore", name: "Aurore", group: "backgrounds", draw: function (g, w, h, a, c) {
        g.fillStyle = "#0b0b14"; g.fillRect(0, 0, w, h);
        var r = rng(7);
        g.filter = "blur(" + Math.round(Math.min(w, h) * 0.12) + "px)";
        for (var i = 0; i < 6; i++) {
          var col = rgb(c[i % 3]);
          g.fillStyle = "rgba(" + col + "," + (0.35 + a * 0.6) + ")";
          g.beginPath(); g.ellipse(r() * w, r() * h * 0.8, w * (0.25 + r() * 0.3), h * (0.12 + r() * 0.2), r() * Math.PI, 0, Math.PI * 2); g.fill();
        }
        g.filter = "none";
      } },
    { id: "maillage", name: "Maillage", group: "backgrounds", draw: function (g, w, h, a, c) {
        g.fillStyle = c[0]; g.fillRect(0, 0, w, h);
        var pts = [[0, 0, 1], [w, 0, 2], [w, h, 0], [0, h, 2], [w * 0.5, h * 0.5, 1]];
        pts.forEach(function (p) {
          var col = rgb(c[p[2]]);
          var gr = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], Math.max(w, h) * (0.5 + a * 0.4));
          gr.addColorStop(0, "rgba(" + col + ",1)"); gr.addColorStop(1, "rgba(" + col + ",0)");
          g.fillStyle = gr; g.fillRect(0, 0, w, h);
        });
      } },
    { id: "degrade", name: "Dégradé doux", group: "backgrounds", draw: function (g, w, h, a, c) {
        var gr = g.createLinearGradient(0, 0, w, h);
        gr.addColorStop(0, c[0]); gr.addColorStop(0.5 + (a - 0.5) * 0.3, c[1]); gr.addColorStop(1, c[2]);
        g.fillStyle = gr; g.fillRect(0, 0, w, h);
      } },
    { id: "verre", name: "Reflets de verre", group: "overlays", draw: function (g, w, h, a) {
        // Reflets spéculaires façon « liquid glass » : bande lumineuse et liseré clair
        var gr = g.createLinearGradient(0, 0, w * 0.6, h);
        gr.addColorStop(0, "rgba(255,255,255," + (0.15 + a * 0.45) + ")"); gr.addColorStop(0.35, "rgba(255,255,255,0.04)"); gr.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = gr; g.fillRect(0, 0, w, h);
        g.strokeStyle = "rgba(255,255,255," + (0.25 + a * 0.5) + ")"; g.lineWidth = Math.max(1.5, Math.min(w, h) * 0.006);
        g.strokeRect(g.lineWidth / 2, g.lineWidth / 2, w - g.lineWidth, h - g.lineWidth);
      } },
    { id: "grain", name: "Grain", group: "overlays", draw: function (g, w, h, a) {
        var img = g.createImageData(w, h), d = img.data, r = rng(3);
        for (var i = 0; i < d.length; i += 4) { var v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = r() < a ? 40 + a * 120 : 0; }
        g.putImageData(img, 0, 0);
      } },
    { id: "bruit", name: "Bruit coloré", group: "overlays", draw: function (g, w, h, a) {
        var img = g.createImageData(w, h), d = img.data, r = rng(11);
        for (var i = 0; i < d.length; i += 4) { d[i] = r() * 255; d[i + 1] = r() * 255; d[i + 2] = r() * 255; d[i + 3] = a * 90; }
        g.putImageData(img, 0, 0);
      } },
    { id: "points", name: "Points", group: "overlays", draw: function (g, w, h, a, c) {
        var s = Math.round(10 + (1 - a) * 22);
        g.fillStyle = c[0];
        for (var y = s / 2; y < h; y += s) for (var x = s / 2; x < w; x += s) { g.beginPath(); g.arc(x, y, Math.max(1, s * 0.09), 0, Math.PI * 2); g.fill(); }
      } },
    { id: "lignes", name: "Lignes", group: "overlays", draw: function (g, w, h, a, c) {
        var s = Math.round(8 + (1 - a) * 24);
        g.strokeStyle = c[0]; g.lineWidth = 1;
        for (var k = -h; k < w; k += s) { g.beginPath(); g.moveTo(k, h); g.lineTo(k + h, 0); g.stroke(); }
      } },
    { id: "grille", name: "Grille", group: "overlays", draw: function (g, w, h, a, c) {
        var s = Math.round(16 + (1 - a) * 48);
        g.strokeStyle = c[0]; g.globalAlpha = 0.5; g.lineWidth = 1;
        for (var x = 0.5; x < w; x += s) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
        for (var y = 0.5; y < h; y += s) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
        g.globalAlpha = 1;
      } },
  ];

  function render(t, w, h) {
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    t.draw(c.getContext("2d"), w, h, $("amount").value / 100, [$("c1").value, $("c2").value, $("c3").value]);
    return c;
  }

  function previews() {
    ["backgrounds", "overlays"].forEach(function (g) { $(g).innerHTML = ""; });
    TEXTURES.forEach(function (t) {
      var b = document.createElement("button");
      b.className = "tile";
      b.title = t.name + " — clic pour insérer";
      b.appendChild(render(t, 160, 160));
      var label = document.createElement("span");
      label.textContent = t.name;
      b.appendChild(label);
      b.addEventListener("click", function () { insert(t); });
      $(t.group).appendChild(b);
    });
  }

  async function insert(t) {
    var dims = $("size").value.split("x").map(Number);
    $("status").textContent = "Génération…";
    try {
      // Générée en 720 px au plus, affichée à la taille choisie : le fichier reste léger pour tout le monde
      var k = Math.min(1, 720 / Math.max(dims[0], dims[1]));
      var url = render(t, Math.round(dims[0] * k), Math.round(dims[1] * k)).toDataURL(t.group === "backgrounds" ? "image/jpeg" : "image/png", 0.9);
      await swiftma.call("insertImage", { url: url, name: t.name, width: dims[0], height: dims[1] });
      $("status").textContent = t.name + " inséré" + (t.group === "overlays" ? " : place-le au-dessus et baisse son opacité (Apparence)." : ".");
    } catch (e) {
      $("status").textContent = "Impossible d'insérer : " + e.message;
    }
  }

  ["c1", "c2", "c3", "amount"].forEach(function (id) { $(id).addEventListener("input", previews); });
  previews();
</script>
</body>
</html>
