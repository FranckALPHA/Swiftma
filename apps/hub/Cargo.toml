[package]
name = "nyota-hub"
version = "0.1.0"
edition = "2024"
description = "Hub Nyota : projets, fichiers, versions et collaboration en temps réel"
license = "MIT"
publish = false

[[bin]]
name = "nyota-hub"
path = "src/main.rs"

[lib]
name = "nyota_hub"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3.34"
indexmap = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
